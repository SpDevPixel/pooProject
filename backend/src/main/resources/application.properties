spring.application.name=emergency-toilet
toilet.csv.path=src/main/resources/data/toilet.csv

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

firebase.credentials.path=firebase-service-account.json

seoul.api.key=${SEOUL_TOILET_API_KEY}
seoul.api.base-url=http://openapi.seoul.go.kr:8088

logging.file.name=/home/ubuntu/app/logs/app.log
logging.logback.rollingpolicy.file-name-pattern=/home/ubuntu/app/logs/app.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
#jwtutil.key = ${JWTUTIL_PASSWORD}