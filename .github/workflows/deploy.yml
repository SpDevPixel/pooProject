name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./backend

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ./backend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get GitHub Actions IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Authorize EC2 SSH access
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 3

      - name: Restart Spring Boot on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app

            echo "1. Stop existing Spring Boot process"
            PID=$(ps -ef | grep 'java -jar' | grep -v grep | awk '{print $2}')

            if [ -z "$PID" ]; then
              echo "No existing Spring Boot process."
            else
              echo "Stopping existing process: $PID"
              kill -15 $PID
              sleep 5
              kill -9 $PID 2>/dev/null || true
            fi

            echo "2. Find latest jar"
            JAR_FILE=$(ls -t ./*.jar | head -n 1)
            chmod +x "$JAR_FILE"

            echo "3. Start Spring Boot"
            nohup java -jar "$JAR_FILE" \
              --spring.datasource.url=${{ secrets.DB_URL }} \
              --spring.datasource.username=${{ secrets.DB_USERNAME }} \
              --spring.datasource.password=${{ secrets.DB_PASSWORD }} > nohup.out 2>&1 </dev/null &

            sleep 15
            if ! pgrep -f "java -jar $JAR_FILE" >/dev/null; then
              echo "Spring Boot failed to start. Last logs:"
              tail -n 120 nohup.out
              exit 1
            fi

            echo "Deploy completed."

      - name: Revoke EC2 SSH access
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
