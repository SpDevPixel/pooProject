name: Deploy Spring Boot to OCI

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. 소스 코드 가져오기
      # ========================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ========================================
      # 2. Java 21
      # ========================================

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      # ========================================
      # 3. Gradle 실행 권한
      # ========================================

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./backend


      # ========================================
      # 4. Spring Boot 빌드
      # ========================================

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ./backend


      # ========================================
      # 5. OCI CLI 설치
      # ========================================

      - name: Install OCI CLI
        run: |
          curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh \
            -o install.sh

          bash install.sh --accept-all-defaults

          echo "$HOME/bin" >> $GITHUB_PATH


      # ========================================
      # 6. OCI 인증 설정
      # ========================================

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci

          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem

          chmod 600 ~/.oci/config
          chmod 600 ~/.oci/oci_api_key.pem


      # ========================================
      # 7. OCI 인증 테스트
      # ========================================

      - name: Test OCI authentication
        run: |
          oci iam region list --output table


      # ========================================
      # 8. GitHub Actions Runner IP 확인
      # ========================================

      - name: Get GitHub Actions IP
        id: ip
        run: |
          echo "ipv4=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"


      # ========================================
      # 9. OCI NSG에 SSH 임시 허용
      # ========================================

      - name: Add temporary SSH rule
        id: nsg
        run: |

          IP="${{ steps.ip.outputs.ipv4 }}"

          echo "GitHub Actions IP: $IP"

          RULE_JSON=$(cat <<EOF
          [
            {
              "direction": "INGRESS",
              "protocol": "6",
              "source": "$IP/32",
              "sourceType": "CIDR_BLOCK",
              "isStateless": false,
              "tcpOptions": {
                "destinationPortRange": {
                  "min": 22,
                  "max": 22
                }
              },
              "description": "Temporary GitHub Actions SSH"
            }
          ]
          EOF
          )

          RESULT=$(oci network nsg rules add \
            --nsg-id "${{ secrets.OCI_NSG_OCID }}" \
            --security-rules "$RULE_JSON")

          echo "$RESULT"

          RULE_ID=$(echo "$RESULT" | jq -r '.data[0].id')

          echo "rule_id=$RULE_ID" >> "$GITHUB_OUTPUT"

          echo "Created rule: $RULE_ID"


      # ========================================
      # 10. JAR 파일 OCI 서버로 전송
      # ========================================

      - name: Deploy JAR to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 3


      # ========================================
      # 11. OCI 서버에서 Spring Boot 재시작
      # ========================================

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}

          script: |

            mkdir -p /home/ubuntu/app

            cd /home/ubuntu/app

            echo "=================================="
            echo "기존 Spring Boot 프로세스 확인"
            echo "=================================="

            PID=$(pgrep -f "java -jar" || true)

            if [ -z "$PID" ]; then

              echo "실행 중인 서버가 없습니다."

            else

              echo "기존 서버 종료: $PID"

              kill -15 $PID

              sleep 5

              kill -9 $PID 2>/dev/null || true

            fi


            echo "=================================="
            echo "JAR 실행"
            echo "=================================="

            chmod +x *.jar

            nohup java -jar *.jar \
              --spring.datasource.url="${{ secrets.DB_URL }}" \
              --spring.datasource.username="${{ secrets.DB_USERNAME }}" \
              --spring.datasource.password="${{ secrets.DB_PASSWORD }}" \
              > nohup.out 2>&1 < /dev/null &


            echo "Spring Boot 시작 완료"


      # ========================================
      # 12. 임시 NSG SSH 규칙 삭제
      # ========================================

      - name: Remove temporary SSH rule
        if: always() && steps.nsg.outputs.rule_id != ''
        run: |

          echo "Removing NSG rule..."

          oci network nsg rules remove \
            --nsg-id "${{ secrets.OCI_NSG_OCID }}" \
            --security-rule-ids "[\"${{ steps.nsg.outputs.rule_id }}\"]" \
            --force